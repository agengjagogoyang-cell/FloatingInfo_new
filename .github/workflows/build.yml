name: Build FloatingInfo

on:
  push:
    branches: [ utama ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ekstrak Zip & Cari pom.xml
        run: |
          unzip -oq ./*.zip -d src_unzip
          SRC_PATH=$(find src_unzip -name pom.xml -printf "%h\n" | head -n 1)
          echo "SRC=$SRC_PATH" >> $GITHUB_ENV

      - name: Build pakai Maven
        working-directory: ${{ env.SRC }}
        run: mvn -B package

      - name: Upload File Jar
        uses: actions/upload-artifact@v4
        with:
          name: FloatingInfo-Plugin
          path: ${{ env.SRC }}/target/*.jar
